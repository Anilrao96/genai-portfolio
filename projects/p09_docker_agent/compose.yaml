name: genai-portfolio-docker

services:
  agent:
    image: genai-portfolio-clearflow:1
    build:
      context: ../..
      dockerfile: projects/p09_docker_agent/Dockerfile
    network_mode: host
    environment:
      PIPELINE_MODEL: '${PIPELINE_MODEL:-qwen3:4b}'
      OLLAMA_BASE_URL: 'http://127.0.0.1:${PIPELINE_OLLAMA_PORT:-11435}'
      LOCAL_AI_NUM_GPU: '0'
      PIPELINE_STATE_PATH: '/app/.runtime/pipeline/audit.sqlite3'
    user: '10001:10001'
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    init: true
    cpus: 0.75
    mem_limit: 384m
    pids_limit: 64
    tmpfs: ['/tmp:rw,noexec,nosuid,size=16m']
    volumes:
      - audit:/app/.runtime
    healthcheck:
      test: ['CMD', 'python', '-m', 'projects.p09_docker_agent.healthcheck']
      interval: 4s
      timeout: 6s
      retries: 4
      start_period: 5s

volumes:
  audit:
