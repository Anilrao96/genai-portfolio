[project]
name = "genai-portfolio"
version = "0.1.0"
description = "Ten local-first GenAI portfolio applications"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "langchain-core>=1.7.6",
    "langchain-ollama>=1.1.0",
    "langgraph>=1,<2",
    "mcp>=2,<3",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--basetemp=.runtime/pytest"
